<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Helix Music Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    /* MÀN HÌNH 1: START SCREEN */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; transition: opacity 0.8s ease;
    }
    .card {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-width: 400px; width: 90%;
    }
    h1 { color: #fff; font-size: 24px; margin-bottom: 20px; letter-spacing: 1px; }
    .file-input-wrapper { margin-bottom: 25px; position: relative; }
    input[type="file"] { display: none; }
    .file-btn {
      background: linear-gradient(45deg, #00f2fe, #4facfe); color: #fff;
      padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold;
      display: inline-block; transition: transform 0.2s, box-shadow 0.2s;
    }
    .file-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4); }
    #file-name { color: #aaa; font-size: 13px; margin-top: 10px; word-break: break-all; min-height: 18px; }
    
    #play-btn {
      background: linear-gradient(45deg, #ff0844, #ffb199); color: #fff; border: none;
      padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold;
      cursor: pointer; opacity: 0.5; pointer-events: none; transition: all 0.3s ease;
    }
    #play-btn.active { opacity: 1; pointer-events: auto; box-shadow: 0 0 20px rgba(255, 8, 68, 0.6); }
    #play-btn.active:hover { transform: scale(1.05); }

    /* MÀN HÌNH 2: 3D STAGE */
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    #loading-msg { color: #4facfe; font-size: 14px; margin-top: 15px; display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- UI MÀN HÌNH 1 -->
  <div id="start-screen">
    <div class="card">
      <h1>3D HELIX VISUALIZER</h1>
      <div class="file-input-wrapper">
        <label for="audio-file" class="file-btn">CHỌN FILE MP3</label>
        <input type="file" id="audio-file" accept="audio/*">
        <div id="file-name">Chưa chọn file nào</div>
      </div>
      <button id="play-btn">PLAY</button>
      <div id="loading-msg">Đang phân tích giai điệu...</div>
    </div>
  </div>

  <!-- CONTAINER 3D -->
  <div id="canvas-container"></div>

<script>
  // --- BIẾN TOÀN CỤC ---
  let scene, camera, renderer, audioCtx, audioBuffer, audioSource;
  let trackGroup, ball, spotLight, ballLight;
  let notesData = [];
  let isPlaying = false;
  let startTime = 0;

  // Cấu hình đường Helix Spiral
  const HELIX_RADIUS = 6;
  const HELIX_PITCH = 1.2; // Độ dốc xuống theo trục Y
  const HELIX_SPEED = 0.8; // Tốc độ xoay góc

  const fileInput = document.getElementById('audio-file');
  const fileNameDisplay = document.getElementById('file-name');
  const playBtn = document.getElementById('play-btn');
  const startScreen = document.getElementById('start-screen');
  const loadingMsg = document.getElementById('loading-msg');

  // --- 1. KHỞI TẠO SCENE 3D ---
  function init3D() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.03);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Ánh sáng môi trường tối
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // Nguồn sáng động chiếu từ bóng xuống (Spotlight & PointLight)
    spotLight = new THREE.SpotLight(0xffffff, 3, 20, Math.PI / 4, 0.5, 1);
    spotLight.castShadow = true;
    scene.add(spotLight);

    ballLight = new THREE.PointLight(0x00f2fe, 2, 10);
    scene.add(ballLight);

    // Quả bóng đa sắc lấp lánh (Icosahedron / Marble)
    const ballGeo = new THREE.IcosahedronGeometry(0.5, 3);
    const ballMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: 0x224488,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.6,
      ior: 1.5,
      clearcoat: 1.0
    });
    ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    scene.add(ball);

    trackGroup = new THREE.Group();
    scene.add(trackGroup);

    window.addEventListener('resize', onWindowResize);
  }

  // --- 2. XỬ LÝ ÂM THANH & PHÂN TÍCH NỐT ---
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    fileNameDisplay.innerText = file.name;
    loadingMsg.style.display = 'block';
    playBtn.classList.remove('active');

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const arrayBuffer = await file.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    // Phân tích dữ liệu âm thanh tìm Peak / Pitch
    analyzeAudio(audioBuffer);

    loadingMsg.style.display = 'none';
    playBtn.classList.add('active');
  });

  function analyzeAudio(buffer) {
    const data = buffer.getChannelData(0);
    const sampleRate = buffer.sampleRate;
    const chunkSize = Math.floor(sampleRate * 0.08); // Phân tích mỗi 80ms
    notesData = [];

    let threshold = 0.15; // Ngưỡng âm lượng để lọc khoảng lặng
    let lastNoteTime = -1;

    for (let i = 0; i < data.length; i += chunkSize) {
      let sum = 0;
      for (let j = 0; j < chunkSize && (i + j) < data.length; j++) {
        sum += data[i + j] * data[i + j];
      }
      let rms = Math.sqrt(sum / chunkSize);
      let time = i / sampleRate;

      // Xử lý Khoảng Lặng (Silence Detection)
      if (rms > threshold) {
        let isHold = false;
        // Nếu nốt trước đó quá gần, gom lại thành thanh trượt (Hold/Slide)
        if (notesData.length > 0 && (time - lastNoteTime) < 0.12) {
          isHold = true;
        }

        notesData.push({
          time: time,
          energy: rms,
          type: isHold ? 'hold' : 'tap'
        });
        lastNoteTime = time;
      }
    }
    
    // Dựng bản đồ 3D Helix từ nốt nhạc đã phân tích
    build3DHelixTrack();
  }

  // --- 3. DỰNG ĐƯỜNG RUNNER HELIX 3D ---
  function build3DHelixTrack() {
    // Dọn dẹp track cũ
    while(trackGroup.children.length > 0){ 
      const obj = trackGroup.children[0];
      trackGroup.remove(obj); 
    }

    const tileGeo = new THREE.BoxGeometry(1.6, 0.2, 0.8);
    const tileMat = new THREE.MeshStandardMaterial({
      color: 0xdddddd,
      roughness: 0.2,
      metalness: 0.5,
      emissive: 0x000000
    });

    const railMat = new THREE.MeshStandardMaterial({
      color: 0x333344,
      roughness: 0.5,
      metalness: 0.8
    });

    notesData.forEach((note, index) => {
      const angle = note.time * HELIX_SPEED;
      const x = Math.cos(angle) * HELIX_RADIUS;
      const z = Math.sin(angle) * HELIX_RADIUS;
      const y = -note.time * HELIX_PITCH;

      if (note.type === 'tap') {
        // Phím gõ đơn (Tap Tile)
        const tile = new THREE.Mesh(tileGeo, tileMat.clone());
        tile.position.set(x, y, z);
        tile.rotation.y = -angle + Math.PI / 2;
        tile.receiveShadow = true;
        tile.userData = { time: note.time, hit: false, type: 'tap' };
        trackGroup.add(tile);
      } else {
        // Thanh trượt dài (Hold/Slide Rail)
        const railGeo = new THREE.BoxGeometry(0.4, 0.1, 1.2);
        const rail = new THREE.Mesh(railGeo, railMat);
        rail.position.set(x, y, z);
        rail.rotation.y = -angle + Math.PI / 2;
        rail.userData = { time: note.time, hit: false, type: 'hold' };
        trackGroup.add(rail);
      }
    });
  }

  // --- 4. PLAY & ANIMATION LOOP ---
  playBtn.addEventListener('click', () => {
    if (!audioBuffer) return;

    startScreen.style.opacity = '0';
    setTimeout(() => startScreen.style.display = 'none', 800);

    if (audioCtx.state === 'suspended') audioCtx.resume();

    audioSource = audioCtx.createBufferSource();
    audioSource.buffer = audioBuffer;
    audioSource.connect(audioCtx.destination);

    startTime = audioCtx.currentTime;
    audioSource.start(0);
    isPlaying = true;

    animate();
  });

  function animate() {
    if (!isPlaying) return;
    requestAnimationFrame(animate);

    const currentTime = audioCtx.currentTime - startTime;

    // Tọa độ hiện tại của bóng trên đường Helix
    const currentAngle = currentTime * HELIX_SPEED;
    const ballX = Math.cos(currentAngle) * HELIX_RADIUS;
    const ballZ = Math.sin(currentAngle) * HELIX_RADIUS;
    const baseY = -currentTime * HELIX_PITCH;

    // Logic nảy Parabol (Tap) vs Lướt mượt (Hold)
    let bounceY = 0;
    const currentBeat = currentTime % 0.4; 
    bounceY = Math.abs(Math.sin(currentBeat * Math.PI / 0.4)) * 0.6; // Độ nảy vừa phải

    ball.position.set(ballX, baseY + 0.5 + bounceY, ballZ);
    ball.rotation.x += 0.05;
    ball.rotation.y += 0.05;

    // Đèn đuổi theo bóng
    spotLight.position.set(ballX * 1.2, ball.position.y + 4, ballZ * 1.2);
    spotLight.target = ball;
    ballLight.position.copy(ball.position);

    // Camera Cinematic đuổi theo phía sau bóng, nhìn chìm xuống dưới
    const camAngle = currentAngle - 0.6; 
    const camX = Math.cos(camAngle) * (HELIX_RADIUS + 4);
    const camZ = Math.sin(camAngle) * (HELIX_RADIUS + 4);
    camera.position.set(camX, ball.position.y + 3, camZ);
    camera.lookAt(ballX, ball.position.y - 1.5, ballZ);

    // Logic Tương tác Va chạm (Hit Detection & Light Trigger)
    trackGroup.children.forEach(child => {
      if (child.userData && !child.userData.hit) {
        if (Math.abs(child.userData.time - currentTime) < 0.1) {
          child.userData.hit = true;
          // Phát sáng bừng lên (Glow Pulse)
          if (child.material.emissive) {
            child.material.emissive.setHex(0x00f2fe);
            child.material.emissiveIntensity = 2.0;
            
            // Giảm độ sáng dần dần
            let fade = setInterval(() => {
              child.material.emissiveIntensity -= 0.1;
              if (child.material.emissiveIntensity <= 0) {
                child.material.emissiveIntensity = 0;
                clearInterval(fade);
              }
            }, 50);
          }
        }
      }
    });

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // Khởi chạy Scene ngay khi load trang
  init3D();
</script>
</body>
</html>
