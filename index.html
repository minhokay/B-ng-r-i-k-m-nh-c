<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>3D Spiral Music Visualizer - Full Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a10; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      overflow-x: hidden;
    }

    /* THANH CÔNG CỤ TRÊN CÙNG */
    #toolbar {
      width: 100%; max-width: 1000px; background: #131520;
      padding: 12px 20px; border-bottom: 1px solid #232738;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 15px; position: sticky; top: 0; z-index: 100;
    }

    .tool-group { display: flex; align-items: center; gap: 10px; }
    label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="file"] { font-size: 12px; color: #ccc; }

    .color-pickers { display: flex; gap: 8px; align-items: center; }
    .color-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    input[type="color"] {
      -webkit-appearance: none; border: none; width: 28px; height: 28px;
      border-radius: 50%; cursor: pointer; background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #444; border-radius: 50%; }

    #downloadBtn {
      background: linear-gradient(135deg, #7000ff, #00f0ff); color: #fff;
      border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold;
      font-size: 13px; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 4px 15px rgba(112, 0, 255, 0.4);
    }
    #downloadBtn:hover { transform: translateY(-1px); opacity: 0.9; }
    #downloadBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* MÀN HÌNH CANVAS 3D PHÍA DƯỚI */
    #canvas-container {
      width: 100%; max-width: 1000px; flex: 1; display: flex;
      justify-content: center; align-items: center; padding: 20px 0;
    }
    canvas {
      border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      outline: none; max-width: 100%; height: auto;
    }
  </style>

  <!-- Import Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- THANH CÔNG CỤ -->
  <div id="toolbar">
    <div class="tool-group">
      <label>Nhạc (.mp3):</label>
      <input type="file" id="audioInput" accept="audio/*">
    </div>

    <div class="color-pickers">
      <div class="color-item">
        <label>Nền</label>
        <input type="color" id="bgColor" value="#05050d">
      </div>
      <div class="color-item">
        <label>Bóng</label>
        <input type="color" id="ballColor" value="#00f0ff">
      </div>
      <div class="color-item">
        <label>Vệt Đuôi</label>
        <input type="color" id="trailColor" value="#7000ff">
      </div>
      <div class="color-item">
        <label>Phím Gõ</label>
        <input type="color" id="padColor" value="#ff0055">
      </div>
    </div>

    <button id="downloadBtn" disabled>💥 Tải Video</button>
  </div>

  <!-- CANVAS 3D -->
  <div id="canvas-container">
    <canvas id="stage3d"></canvas>
  </div>

  <script>
    // 1. KHỞI TẠO KHÔNG GIAN THREE.JS
    const canvas = document.getElementById('stage3d');
    const width = 800, height = 600;
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(document.getElementById('bgColor').value);

    const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 15, 10);
    scene.add(dirLight);

    // 2. TẠO BÓNG & HỆ THỐNG VỆT BỤI SAO (PARTICLE TRAIL)
    const ballGeo = new THREE.SphereGeometry(0.45, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({
      color: document.getElementById('ballColor').value,
      emissive: document.getElementById('ballColor').value,
      emissiveIntensity: 0.7,
      roughness: 0.1
    });
    const ballMesh = new THREE.Mesh(ballGeo, ballMat);
    scene.add(ballMesh);

    const trailLength = 50;
    const trailHistory = [];
    const trailGeo = new THREE.BufferGeometry();
    const trailPositions = new Float32Array(trailLength * 3);
    trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));

    const pCanvas = document.createElement('canvas');
    pCanvas.width = 32; pCanvas.height = 32;
    const pCtx = pCanvas.getContext('2d');
    const grad = pCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.4, 'rgba(0,240,255,0.7)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    pCtx.fillStyle = grad; pCtx.fillRect(0, 0, 32, 32);

    const particleTexture = new THREE.CanvasTexture(pCanvas);
    const trailMat = new THREE.PointsMaterial({
      size: 0.4,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const particleTrail = new THREE.Points(trailGeo, trailMat);
    scene.add(particleTrail);

    let trackGroup = new THREE.Group();
    scene.add(trackGroup);

    let trackPoints = [];

    // 3. SINH ĐƯỜNG XOẮN ỐC 3D TỰ ĐỘNG THEO MP3
    function generate3DSpiralTrack(audioBuffer) {
      scene.remove(trackGroup);
      trackGroup = new THREE.Group();
      scene.add(trackGroup);
      trackPoints = [];

      const rawData = audioBuffer.getChannelData(0);
      const samples = 180;
      const blockSize = Math.floor(rawData.length / samples);

      let radius = 4.0;
      let angle = 0;
      let currentY = 0;

      for (let i = 0; i < samples; i++) {
        let sum = 0;
        let blockStart = blockSize * i;
        for (let j = 0; j < blockSize; j += 120) {
          sum += Math.abs(rawData[blockStart + j]);
        }
        let volume = sum / (blockSize / 120);

        let x = Math.cos(angle) * radius;
        let z = Math.sin(angle) * radius;

        if (volume > 0.05) {
          // Đoạn sôi động -> Phím gõ
          const padGeo = new THREE.BoxGeometry(1.2, 0.16, 0.6);
          const padMat = new THREE.MeshStandardMaterial({
            color: document.getElementById('padColor').value,
            emissive: document.getElementById('padColor').value,
            emissiveIntensity: 0.5
          });
          const pad = new THREE.Mesh(padGeo, padMat);
          pad.position.set(x, currentY, z);
          pad.rotation.y = -angle;
          trackGroup.add(pad);

          trackPoints.push({ x, y: currentY, z, angle, type: 'note', mesh: pad });
          currentY -= 0.85;
          angle += 0.4;
        } else {
          // Đoạn trầm -> Đường trượt êm (Rail)
          const railGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.8, 16);
          const railMat = new THREE.MeshStandardMaterial({
            color: document.getElementById('trailColor').value,
            emissive: document.getElementById('trailColor').value,
            emissiveIntensity: 0.7
          });
          const rail = new THREE.Mesh(railGeo, railMat);
          rail.position.set(x, currentY - 0.4, z);
          rail.rotation.x = Math.PI / 2;
          rail.rotation.z = angle;
          trackGroup.add(rail);

          trackPoints.push({ x, y: currentY, z, angle, type: 'rail', mesh: rail });
          currentY -= 1.3;
          angle += 0.55;
        }
      }
    }

    // 4. LẮP FILE ÂM THANH
    let audioCtx, audioBuffer;
    document.getElementById('audioInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await file.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      
      generate3DSpiralTrack(audioBuffer);
      document.getElementById('downloadBtn').disabled = false;
      startAnimation();
    });

    // Tùy chỉnh màu sắc live
    document.getElementById('bgColor').addEventListener('input', (e) => scene.background.set(e.target.value));
    document.getElementById('ballColor').addEventListener('input', (e) => {
      ballMat.color.set(e.target.value);
      ballMat.emissive.set(e.target.value);
    });

    // 5. VÒNG LẶP CHUYỂN ĐỘNG & CAMERA CINEMATIC
    let animIndex = 0;
    let isAnimating = false;

    function startAnimation() {
      animIndex = 0;
      trailHistory.length = 0;
      isAnimating = true;
      animate();
    }

    function animate() {
      if (!isAnimating || trackPoints.length === 0) return;

      let currIdx = Math.floor(animIndex);
      let nextIdx = (currIdx + 1) % trackPoints.length;
      let progress = animIndex - currIdx;

      let p1 = trackPoints[currIdx];
      let p2 = trackPoints[nextIdx];

      if (p1 && p2) {
        let x = THREE.MathUtils.lerp(p1.x, p2.x, progress);
        let z = THREE.MathUtils.lerp(p1.z, p2.z, progress);
        
        let baseY = THREE.MathUtils.lerp(p1.y, p2.y, progress);
        let bounceHeight = 0;

        if (p1.type === 'note') {
          bounceHeight = Math.sin(progress * Math.PI) * 0.9;
        } else {
          bounceHeight = Math.sin(progress * Math.PI) * 0.12;
        }

        ballMesh.position.set(x, baseY + 0.45 + bounceHeight, z);

        // Cập nhật vị trí hạt vệt bụi sao
        trailHistory.unshift(ballMesh.position.clone());
        if (trailHistory.length > trailLength) trailHistory.pop();

        const posArr = trailGeo.attributes.position.array;
        for (let i = 0; i < trailLength; i++) {
          if (trailHistory[i]) {
            posArr[i * 3] = trailHistory[i].x;
            posArr[i * 3 + 1] = trailHistory[i].y;
            posArr[i * 3 + 2] = trailHistory[i].z;
          }
        }
        trailGeo.attributes.position.needsUpdate = true;

        // Camera xoay lốc xoáy
        let camAngle = THREE.MathUtils.lerp(p1.angle, p2.angle, progress) - 0.55;
        let camRadius = 9.0;
        
        let targetCamX = Math.cos(camAngle) * camRadius;
        let targetCamZ = Math.sin(camAngle) * camRadius;
        let targetCamY = ballMesh.position.y + 4.0;

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.1);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, 0.1);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.1);

        camera.lookAt(0, ballMesh.position.y - 2.0, 0);

        if (p1.type === 'note' && p1.mesh && progress < 0.25) {
          p1.mesh.material.emissiveIntensity = 1.4;
        } else if (p1.mesh) {
          p1.mesh.material.emissiveIntensity = 0.5;
        }
      }

      animIndex += 0.055;
      if (animIndex >= trackPoints.length - 1) animIndex = 0;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // 6. XUẤT VIDEO 1-CLICK
    document.getElementById('downloadBtn').onclick = () => {
      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.innerText = "⏳ Đang Tải...";
      downloadBtn.disabled = true;

      const stream = canvas.captureStream(60);
      let recordedChunks = [];
      const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '3d-music-visualizer.webm';
        a.click();

        downloadBtn.innerText = "💥 Tải Video";
        downloadBtn.disabled = false;
      };

      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), 10000);
    };
  </script>
</body>
</html>
